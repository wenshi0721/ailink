name: 功能建议
description: 为 AiLink 提出新功能或改进建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 提交前请先搜索现有 issue 避免重复。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在什么场景下遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - App 界面 / 交互
        - AI 回复策略
        - OneBot v11 接入
        - 手机内置 QQ 运行时
        - 其他 / 桥接端脚本
    validations:
      required: true
